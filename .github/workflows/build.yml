name: Build DoorOpener

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark start (diagnostic)
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b marker
          echo "=== RUN STARTED $(date -u +%Y-%m-%dT%H:%M:%SZ) ===" > marker.txt
          echo "runner: $RUNNER_OS" >> marker.txt
          git add marker.txt
          git commit -m "CI marker"
          git push -f origin marker
          echo "marker pushed"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -list -project DoorOpener.xcodeproj || true

      - name: Build unsigned IPA
        run: |
          set -e
          mkdir -p build
          xcodebuild clean archive \
            -project DoorOpener.xcodeproj \
            -scheme DoorOpener \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/DoorOpener.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            -quiet
          echo "Archive done"
          ls -la build/DoorOpener.xcarchive/Products/Applications/
          mkdir -p build/ipa/Payload
          cp -R build/DoorOpener.xcarchive/Products/Applications/DoorOpener.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../DoorOpener-unsigned.ipa Payload
          cd ../..
          ls -lh build/DoorOpener-unsigned.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoorOpener-unsigned-IPA
          path: build/DoorOpener-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to artifacts branch
        run: |
          set -e
          cp build/DoorOpener-unsigned.ipa ./DoorOpener-unsigned.ipa
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan artifacts
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f DoorOpener-unsigned.ipa
          git commit -m "Unsigned IPA build $(date +%Y%m%d-%H%M)" || true
          git push -f origin artifacts
          echo "IPA published to artifacts branch"

      - name: Record failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -b ci-error 2>/dev/null || git checkout ci-error
          echo "=== BUILD FAILED $(date -u) ===" > error.log
          echo "job: $GITHUB_JOB" >> error.log
          git add error.log 2>/dev/null || true
          git commit -m "build failed marker" 2>/dev/null || true
          git push -f origin ci-error 2>/dev/null || echo "push failed too"
          exit 1
